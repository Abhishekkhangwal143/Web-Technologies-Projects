<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1128">
<meta name="description" content="Next-Gen Next-Gen Academic Platform for ICFAI University Jaipur and IcfaiTech. Engineered for Innovators.">
<title>IcfaiTech & ICFAI University Jaipur | Future Ready</title>

<style>
:root {
  --cyber-dark: #0a1128;
  --neon-blue: #00f2fe;
  --electric-cyan: #4facfe;
  --sunset-orange: #ff5e62;
  --glass-white: rgba(255, 255, 255, 0.95);
  --text-primary: #1c2434;
  --text-muted: #64748b;
  --canvas-bg: #f8fafc;
  --border-subtle: #e2e8f0;
  --soft-shadow: 0 20px 40px -15px rgba(10, 17, 40, 0.05);
  --panel-radius: 16px;
  --wrapper-max: 1200px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--canvas-bg); color: var(--text-primary); overflow-x: hidden; line-height: 1.6; }

.container { width: min(var(--wrapper-max), calc(100% - 40px)); margin: auto; }
.wrapper-section { padding: 100px 0; }
.tagline { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--electric-cyan); margin-bottom: 16px; display: inline-block; }
.header-block { max-width: 680px; margin-bottom: 60px; }
.header-block h2 { font-size: clamp(32px, 4.5vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 20px; }
.header-block p { color: var(--text-muted); font-size: 18px; }

/* Global Buttons */
.interactive-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 30px; padding: 14px 28px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.interactive-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(79, 172, 254, 0.3); }
.btn-neon { color: #fff; background: linear-gradient(135deg, var(--electric-cyan), var(--neon-blue)); }
.btn-outline { background: transparent; border: 2px solid var(--border-subtle); color: var(--cyber-dark); }
.btn-outline:hover { background: var(--cyber-dark); color: #fff; border-color: var(--cyber-dark); }

/* Premium Header Logo Structure */
.header-branding { display: flex; align-items: center; gap: 12px; }
.logo-shield { width: 44px; height: 44px; background: linear-gradient(135deg, #0a1128, #1e293b); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--neon-blue); font-weight: 900; font-size: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.branding-meta h3 { font-size: 16px; font-weight: 800; color: var(--cyber-dark); line-height: 1.1; }
.branding-meta p { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; font-weight: 600; }

/* Futuristic Navbar */
.app-navigation { position: fixed; z-index: 999; top: 0; left: 0; right: 0; height: 80px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); transition: all 0.3s; }
.navigation-flex { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.navigation-links { display: flex; align-items: center; gap: 32px; list-style: none; }
.navigation-links a { font-size: 14px; font-weight: 600; color: #475569; transition: color 0.2s; }
.navigation-links a:hover { color: var(--electric-cyan); }

/* Reimagined Hero Zone */
.hero-zone { min-height: 90vh; padding: 160px 0 100px; background: radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 45%), radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 50%), #fff; position: relative; display: flex; align-items: center; }
.hero-flex-layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 60px; align-items: center; }
.hero-content h1 { font-size: clamp(44px, 6vw, 76px); font-weight: 900; line-height: 1.05; letter-spacing: -.05em; color: var(--cyber-dark); }
.hero-content h1 span { background: linear-gradient(135deg, var(--electric-cyan), var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-description { font-size: 19px; color: var(--text-muted); margin: 24px 0 36px; max-width: 580px; }
.hero-control-group { display: flex; gap: 16px; flex-wrap: wrap; }

/* Floating Stats Panel inside Hero Placement */
.showcase-wrapper { position: relative; }
.showcase-frame { width: 100%; height: 560px; object-fit: cover; border-radius: var(--panel-radius); box-shadow: 0 30px 60px rgba(10,17,40,0.12); }
.info-floating-card { position: absolute; right: -20px; bottom: 40px; background: var(--cyber-dark); color: #fff; padding: 24px; border-radius: var(--panel-radius); box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-width: 240px; }
.info-floating-card span { display: block; font-size: 11px; text-transform: uppercase; color: var(--neon-blue); letter-spacing: 0.1em; font-weight: 700; margin-bottom: 4px; }
.info-floating-card h4 { font-size: 28px; font-weight: 800; line-height: 1.1; }
.info-floating-card p { font-size: 12px; color: #94a3b8; margin-top: 6px; }

/* Grid Cards & Metrics Components */
.metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: -50px; position: relative; z-index: 10; }
.metric-card { background: #fff; padding: 30px 24px; border-radius: var(--panel-radius); border: 1px solid var(--border-subtle); box-shadow: var(--soft-shadow); text-align: center; }
.metric-card h3 { font-size: 36px; font-weight: 800; color: var(--cyber-dark); letter-spacing: -0.03em; }
.metric-card p { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

.cards-container-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.feature-box { background: #fff; padding: 40px 30px; border-radius: var(--panel-radius); border: 1px solid var(--border-subtle); transition: all 0.3s; }
.feature-box:hover { transform: translateY(-5px); box-shadow: var(--soft-shadow); border-color: var(--electric-cyan); }
.box-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(79, 172, 254, 0.1); color: var(--electric-cyan); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 24px; }
.feature-box h4 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: var(--cyber-dark); }
.feature-box p { font-size: 14px; color: var(--text-muted); }

/* Modern Tech Node Matrix Panel */
.matrix-container { background: linear-gradient(145deg, #0a1128, #111a36); color: #fff; border-radius: 24px; padding: 60px; position: relative; overflow: hidden; }
.matrix-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; align-items: center; }
.matrix-left h3 { font-size: 36px; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.02em; }
.matrix-left p { color: #94a3b8; font-size: 16px; margin-bottom: 30px; }
.node-subgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.node-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 12px; }
.node-item strong { display: block; color: var(--neon-blue); font-size: 15px; margin-bottom: 4px; }
.node-item span { font-size: 13px; color: #cbd5e1; }

/* Beautiful Interactive Connection Web Visualization */
.matrix-right-visual { display: flex; align-items: center; justify-content: center; position: relative; min-height: 320px; }
.quantum-ring { width: 280px; height: 280px; border: 2px dashed rgba(0, 242, 254, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: spinRing 40s linear infinite; }
.quantum-ring-inner { width: 180px; height: 180px; border: 2px solid rgba(79, 172, 254, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
.quantum-nucleus { width: 90px; height: 90px; background: linear-gradient(135deg, var(--electric-cyan), var(--cyber-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; box-shadow: 0 0 35px rgba(0, 242, 254, 0.4); z-index: 5; }
.orbit-particle { position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px var(--neon-blue); }
.p-top { top: -6px; left: 50%; transform: translateX(-50%); }
.p-right { right: -6px; top: 50%; transform: translateY(-50%); }
.p-bottom { bottom: -6px; left: 50%; transform: translateX(-50%); }

@keyframes spinRing { 100% { transform: rotate(360deg); } }

/* Dynamic Filter System Layout */
.filter-tabs-wrapper { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; justify-content: center; }
.tab-trigger { background: #fff; border: 1px solid var(--border-subtle); padding: 10px 24px; font-size: 14px; font-weight: 600; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
.tab-trigger.active, .tab-trigger:hover { background: var(--cyber-dark); color: #fff; border-color: var(--cyber-dark); }

@media (max-width: 992px) {
  .hero-flex-layout, .matrix-grid { grid-template-columns: 1fr; gap: 40px; }
  .metric-row { grid-template-columns: repeat(2, 1fr); margin-top: 40px; }
  .cards-container-3 { grid-template-columns: 1fr; }
  .navigation-links { display: none; }
}
</style>
</head>
